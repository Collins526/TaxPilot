spring.application.name=taxpilot

server.port=8080

# Load the repository-level .env for local runs from the backend directory.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:taxpilot}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${DB_USERNAME:taxpilot}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD:}}}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:}
app.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Document storage (Cloudinary)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# AI assistant (OpenAI-compatible; explanation only, never calculates tax)
assistant.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
assistant.api-key=${OPENAI_API_KEY:}
assistant.model=${OPENAI_MODEL:gpt-4o-mini}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=false
