spring.application.name=taxpilot

server.port=8080

# Primary datasource for local development; tests default to H2 memory DB
spring.datasource.url=jdbc:h2:mem:taxpilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=false
